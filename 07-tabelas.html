<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableas em HTML 5</title>
</head>
<body>
    <h1>Tabelas em HTML 5</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Nome do aluno</th>
                <th>Disciplina</th>
                <th>nota final</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alexandre</td>
                <td>Matemática</td>
                <td>10,0</td>
            </tr>

            <tr>
                <td>Nelson</td>
                <td>Português</td>
                <td>10,0</td>
            </tr>

            <tr>
                <td>Enzo Pereira</td>
                <td>História</td>
                <td>10,0</td>
            </tr>
            
            <tr>
                <td>Matheus</td>
                <td>Educação fisíca</td>
                <td>10,0</td>
            </tr>

            <tr>
                <td>vitor</td>
                <td>artes</td>
                <td>10,0</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="2"><strong>Média da turma</strong></td>
                <td><strong>10,0</strong></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
